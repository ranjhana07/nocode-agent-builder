name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[agent,dev]"
      - name: Compile
        run: python -m compileall -q nocode_agent mockplatform
      - name: Test
        run: python -m pytest
